backend:
  name: turbo-github
  turbo_site_id: b82e48e5-869b-4b45-8e97-b16bac7822f3
  branch: main

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: recipes
    label: Recipes
    folder: src/content/recipes
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Short description, name: description, widget: text }
      - { label: Main photo, name: image, widget: image, required: false }
      - label: Category
        name: category
        widget: select
        required: false
        options: [Main dish, Soup, Side, Salad, Sauce, Condiment, Pantry staple, Snack, Breakfast, Dessert, Drink, Kitchen basic]
      - label: Tags
        name: tags
        widget: list
        required: false
        default: []
        label_singular: Tag
        field:
          label: Tag
          name: tag
          widget: string
      - { label: Yield, name: yield, widget: string, required: false }
      - { label: Prep time, name: prepTime, widget: string, required: false }
      - { label: Cook time, name: cookTime, widget: string, required: false }
      - { label: Temperature, name: temperature, widget: string, required: false }
      - label: Ingredients
        name: ingredients
        widget: list
        label_singular: Ingredient
        summary: "{{fields.ingredient}}"
        fields:
          - label: Ingredient
            name: ingredient
            widget: string
          - label: Linked Fate Apothecary recipe
            name: linkedRecipe
            widget: relation
            collection: recipes
            search_fields: [title, description]
            display_fields: [title]
            value_field: "{{slug}}"
            required: false
            hint: "Optional. Use this when the ingredient is another Fate Apothecary recipe."
          - label: Product / external link
            name: externalUrl
            widget: string
            required: false
            hint: "Optional. Paste a full URL for a specific ingredient or product. Use this OR Linked Fate Apothecary recipe, not both."
          - label: Affiliate link?
            name: externalAffiliate
            widget: boolean
            default: false
            required: false
            hint: "Turn this on only if this exact external URL can earn Fate Apothecary a commission."
      - label: Tools we use
        name: tools
        widget: relation
        collection: kitchen_tools
        search_fields: [title, category, description]
        display_fields: [title]
        value_field: "{{slug}}"
        multiple: true
        required: false
        hint: "Optional. Choose anything from Library · Kitchen & Cooking used for this recipe."
      - label: Instructions
        name: instructions
        widget: list
        label_singular: Step
        fields:
          - { label: Step title, name: title, widget: string }
          - { label: Step, name: text, widget: text }
      - { label: Use your heart, name: useYourHeart, widget: text, required: false }
      - label: Notes & tips
        name: notes
        widget: list
        required: false
        default: []
        label_singular: Note
        field:
          label: Note
          name: note
          widget: string
      - label: Storage
        name: storage
        widget: list
        required: false
        default: []
        label_singular: Storage note
        field:
          label: Storage note
          name: storageNote
          widget: string
      - { label: How we eat it, name: serving, widget: text, required: false }
      - { label: Last updated, name: lastUpdated, widget: string, required: false }
      - { label: Featured, name: featured, widget: boolean, default: false }

  - name: kitchen_tools
    label: "Library · Kitchen & Cooking"
    folder: src/content/kitchen-tools
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Tool name, name: title, widget: string }
      - label: Category
        name: category
        widget: select
        required: false
        options: [Appliances, Cookware, Prep tools, Baking, Storage, Serving, Grill & outdoor, Other]
      - { label: Short description, name: description, widget: text }
      - { label: Photo, name: image, widget: image, required: false, hint: "Upload your own photo whenever possible. Avoid copying retailer product images unless you have permission to use them." }
      - { label: Why we use it, name: whyWeUseIt, widget: text, required: false }
      - { label: Purchase / affiliate link, name: purchaseUrl, widget: string, required: false, hint: "Paste the full product URL. This can be an affiliate link." }
      - { label: "Affiliate link?", name: affiliate, widget: boolean, default: false, required: false, hint: "Leave this off unless this exact URL can earn Fate Apothecary a commission." }
      - { label: Featured, name: featured, widget: boolean, default: false }

  - name: garden_resources
    label: "Library · Garden & Growing"
    folder: src/content/garden-resources
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Item name, name: title, widget: string }
      - label: Category
        name: category
        widget: select
        required: false
        options: [Tools & equipment, Seeds & starts, Soil & amendments, Watering & irrigation, Containers & raised beds, Harvest & storage, Other]
      - { label: Short description, name: description, widget: text }
      - { label: Photo, name: image, widget: image, required: false, hint: "Upload your own photo whenever possible. Avoid copying retailer product images unless you have permission to use them." }
      - { label: Why we use it, name: whyWeUseIt, widget: text, required: false }
      - { label: Purchase / resource link, name: purchaseUrl, widget: string, required: false, hint: "Paste the full URL. This can later be an affiliate link." }
      - { label: "Affiliate link?", name: affiliate, widget: boolean, default: false, required: false, hint: "Leave this off unless this exact URL can earn Fate Apothecary a commission." }
      - { label: Featured, name: featured, widget: boolean, default: false }

  - name: bookshelf
    label: "Library · Bookshelf"
    folder: src/content/bookshelf
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Author / creator, name: author, widget: string, required: false }
      - label: Category
        name: category
        widget: select
        required: false
        options: [Herbalism, Cooking, Gardening, Reference, Other]
      - { label: Short note, name: description, widget: text, required: false, hint: "Optional. A quick note about why you use or recommend this resource." }
      - { label: Cover / image, name: image, widget: image, required: false, hint: "Upload your own photo of the book/resource whenever possible. Avoid copying retailer product images unless you have permission to use them." }
      - { label: Link, name: url, widget: string, required: false, hint: "Paste the full URL. This can later be an Amazon Associates or other affiliate link." }
      - { label: "Affiliate link?", name: affiliate, widget: boolean, default: false, required: false, hint: "Leave this off unless this exact URL can earn Fate Apothecary a commission." }
      - { label: Featured, name: featured, widget: boolean, default: false }

  - name: herbs
    label: Herbs
    folder: src/content/herbs
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Herb name, name: title, widget: string }
      - { label: Botanical name, name: description, widget: string, hint: "Example: Origanum vulgare. This keeps the existing field compatible with herb profiles you have already created." }
      - { label: Main photo, name: image, widget: image, required: false }
      - label: Tags
        name: tags
        widget: list
        required: false
        default: []
        label_singular: Tag
        field:
          label: Tag
          name: tag
          widget: string
      - { label: Flavor & aroma, name: flavorProfile, widget: text, required: false }
      - label: Culinary uses
        name: culinaryUses
        widget: list
        required: false
        default: []
        label_singular: Culinary use
        field:
          label: Culinary use
          name: culinaryUse
          widget: string
      - { label: Traditional use notes, name: traditionalUses, widget: text, required: false }
      - { label: Growing notes, name: growingNotes, widget: text, required: false }
      - { label: Storage & preserving, name: storage, widget: text, required: false }
      - { label: Cautions / things to know, name: cautions, widget: text, required: false }
      - label: Books & resources I use
        name: resources
        widget: relation
        collection: bookshelf
        search_fields: [title, author, description]
        display_fields: [title, author]
        value_field: "{{slug}}"
        multiple: true
        required: false
        hint: "Optional. Choose books or reference resources you actually use for this herb. Add reusable resources under Library · Bookshelf first."
      - label: Related herbs
        name: relatedHerbs
        widget: relation
        collection: herbs
        search_fields: [title, description]
        display_fields: [title, description]
        value_field: "{{slug}}"
        multiple: true
        required: false
        hint: "Optional. Choose other Fate Apothecary herb profiles that are useful to explore next."
      - { label: Last updated, name: lastUpdated, widget: string, required: false }
      - { label: Featured, name: featured, widget: boolean, default: false }

  - name: garden
    label: Garden
    folder: src/content/garden
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Short description, name: description, widget: text }
      - { label: Main photo, name: image, widget: image, required: false }
      - label: Tags
        name: tags
        widget: list
        required: false
        default: []
        label_singular: Tag
        field:
          label: Tag
          name: tag
          widget: string
      - { label: Season / timing, name: season, widget: string, required: false }
      - label: What you need
        name: whatYouNeed
        widget: list
        required: false
        default: []
        label_singular: Item
        field:
          label: Item
          name: item
          widget: string
      - label: Steps
        name: steps
        widget: list
        required: false
        label_singular: Step
        fields:
          - { label: Step title, name: title, widget: string }
          - { label: Step, name: text, widget: text }
      - { label: Harvest / what to expect, name: harvest, widget: text, required: false }
      - label: Notes & tips
        name: notes
        widget: list
        required: false
        default: []
        label_singular: Note
        field:
          label: Note
          name: note
          widget: string
      - { label: Last updated, name: lastUpdated, widget: string, required: false }
      - { label: Featured, name: featured, widget: boolean, default: false }
